# Development only. `docker compose` loads this file on its own; production names its files with -f
# (compose.yaml and compose.production.yaml), so none of this reaches it.
# Every message goes to Mailpit, whatever .env says, so nothing real can be sent from a development machine.
services:
  backend:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      MAIL_TRANSPORT: smtp
      MAIL_ALLOW_REAL_DELIVERY: "false"
      APP_PUBLIC_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_STARTTLS: "false"
      SMTP_USE_SSL: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@openlabs3d.local
      SMTP_FROM_NAME: OpenLabs3D (development)
      # Shown on the "check your inbox" pages, so nobody waits for mail that goes here instead.
      MAIL_CAPTURE_URL: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    # This computer only. The interface has no password and shows every link it captured.
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 1000

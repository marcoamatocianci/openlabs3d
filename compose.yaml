# Shared by development and production.
#   Development:  docker compose up -d --build          (this file + compose.override.yaml; SQLite, Mailpit)
#   Development with PostgreSQL: see docs/deployment/POSTGRESQL_MIGRATION.md ("Local PostgreSQL")
#   Production:   docker compose -f compose.yaml -f compose.production.yaml up -d --build   (see deploy/README.md)
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/openlabs3d.db}
  UPLOAD_DIR: /app/data/uploads

services:
  backend:
    build: {context: ./backend, target: web}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-environment
      SEED_OFFICIAL_COLLECTION: "true"
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-file}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${PUBLIC_BASE_URL:-http://localhost:8080}}
      EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
      EMAIL_RESEND_COOLDOWN_SECONDS: ${EMAIL_RESEND_COOLDOWN_SECONDS:-60}
      EMAIL_RESEND_HOURLY_LIMIT: ${EMAIL_RESEND_HOURLY_LIMIT:-5}
      UNVERIFIED_ACCOUNT_RETENTION_DAYS: ${UNVERIFIED_ACCOUNT_RETENTION_DAYS:-7}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-${SMTP_STARTTLS:-true}}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OpenLabs3D}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      MAIL_ALLOW_REAL_DELIVERY: ${MAIL_ALLOW_REAL_DELIVERY:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      MAX_IMAGES_PER_LISTING: ${MAX_IMAGES_PER_LISTING:-5}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # CAD analysis and previews (Blender), outside the web process. Starts once the backend has migrated.
  worker:
    build: {context: ./backend, target: worker}
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-environment
      DB_APPLICATION_NAME: openlabs3d-worker
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
      CAD_RENDER_THREADS: ${CAD_RENDER_THREADS:-2}
      CAD_RENDER_TIMEOUT_SECONDS: ${CAD_RENDER_TIMEOUT_SECONDS:-300}
      RACK_BUILD_TIMEOUT_SECONDS: ${RACK_BUILD_TIMEOUT_SECONDS:-180}
      RACK_BUILD_MEMORY_MB: ${RACK_BUILD_MEMORY_MB:-4096}
    volumes:
      - app_data:/app/data

  # PostgreSQL for development is opt-in (profile "postgres"); production always runs it.
  db:
    image: postgres:18.6-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: openlabs3d
      POSTGRES_USER: openlabs3d
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-development-only}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlabs3d -d openlabs3d"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./style.css:/srv/style.css:ro
      - ./assets:/srv/assets:ro
      - ./collection.js:/srv/collection.js:ro
      - ./app.js:/srv/app.js:ro
      - ./marketplace.js:/srv/marketplace.js:ro
      - ./operations.js:/srv/operations.js:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  app_data:
  pg_data:
  caddy_data:
  caddy_config:

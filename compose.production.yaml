services:
  backend:
    environment:
      APP_ENV: production
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      # New accounts cannot be activated without email, so a deployment without it does not start.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${PUBLIC_BASE_URL:?Set APP_PUBLIC_URL to the public https address of the site}}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to your mail provider. See docs/email/EMAIL_VERIFICATION.md}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL to a sender verified with your mail provider}
  caddy:
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your public domain}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./style.css:/srv/style.css:ro
      - ./assets:/srv/assets:ro
      - ./collection.js:/srv/collection.js:ro
      - ./app.js:/srv/app.js:ro
      - ./marketplace.js:/srv/marketplace.js:ro
      - ./operations.js:/srv/operations.js:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && wget -q -O /dev/null http://backend:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
